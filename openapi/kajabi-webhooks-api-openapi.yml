                      type:
                        type: string
                        enum:
                        - purchases
                      attributes:
                        $ref: '#/components/schemas/purchases_attributes'
                      relationships:
                        type: object
                        properties:
                          customer:
                            type: object
                            properties:
                              data:
                                type: object
                                properties:
                                  id:
